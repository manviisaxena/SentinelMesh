server {
  listen 80;
  server_name _;
  client_max_body_size 2m;
  location /api/logs { proxy_pass http://ingestion:8001/api/logs; proxy_set_header Host $host; }
  location /api/threats { proxy_pass http://detection:8002/api/threats; proxy_set_header Host $host; }
  location /api/intelligence/ { proxy_pass http://intelligence:8003/api/intelligence/; proxy_set_header Host $host; }
  location /api/incidents { proxy_pass http://incident:8004/api/incidents; proxy_set_header Host $host; }
  location /health { return 200 '{"status":"ok","service":"gateway"}'; add_header Content-Type application/json; }
  location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
}
