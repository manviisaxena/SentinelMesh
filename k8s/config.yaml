apiVersion: v1
kind: ConfigMap
metadata: {name: sentinel-config}
data:
  RABBITMQ_HOST: rabbitmq
  INTELLIGENCE_URL: http://intelligence:8003
---
apiVersion: v1
kind: Secret
metadata: {name: sentinel-secrets}
type: Opaque
stringData:
  POSTGRES_USER: sentinel
  POSTGRES_PASSWORD: replace-this-password
  RABBITMQ_USER: sentinel
  RABBITMQ_PASSWORD: replace-this-password
