apiVersion: v1
kind: Service
metadata: {name: rabbitmq}
spec: {selector: {app: rabbitmq}, ports: [{name: amqp, port: 5672}, {name: management, port: 15672}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rabbitmq}
spec:
  replicas: 1
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata: {labels: {app: rabbitmq}}
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management-alpine
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom: {secretKeyRef: {name: sentinel-secrets, key: RABBITMQ_USER}}
        - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: sentinel-secrets, key: RABBITMQ_PASSWORD}}}
        ports: [{containerPort: 5672}, {containerPort: 15672}]
        readinessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 15, periodSeconds: 10}
        livenessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 30, periodSeconds: 20}
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 768Mi}}
